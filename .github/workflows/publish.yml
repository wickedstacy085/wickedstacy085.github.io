name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Всё ставится на сервере GitHub — на квать не нужно
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::here
            any::readr
            any::readxl
            any::dplyr
            any::purrr
            any::tibble
            any::zoo
            any::urca
            any::vars
            any::forecast

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jupyter numpy pandas matplotlib scipy statsmodels

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
