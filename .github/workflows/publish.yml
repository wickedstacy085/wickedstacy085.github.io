name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:            # новая сборка отменяет незавершённую: старая версия не перезапишет новую
  group: publish-site
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Всё ставится на сервере GitHub — на компьютере ничего устанавливать не нужно
      - uses: quarto-dev/quarto-actions/setup@v2

      # Зеркало apt на раннерах иногда зависает: первая попытка ограничена 4 минутами,
      # при неудаче установка R повторяется автоматически.
      - id: r1
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 4
        continue-on-error: true
        with:
          use-public-rspm: true
      - if: steps.r1.outcome != 'success'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::here
            any::readr
            any::readxl
            any::dplyr
            any::purrr
            any::tibble
            any::zoo
            any::urca
            any::vars
            any::forecast

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jupyter numpy pandas matplotlib scipy statsmodels

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
