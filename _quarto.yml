project:
  type: website
  output-dir: _site
  resources:
    - cv.pdf
    - cv-en.pdf

execute:
  freeze: auto        # код считается локально, CI только собирает HTML из _freeze/

website:
  title: "Анастасия Смирнова"
  description: "Эконометрика временных рядов и макропрогнозирование"
  site-url: "https://wickedstacy085.github.io"
  repo-url: "https://github.com/wickedstacy085/wickedstacy085.github.io"
  page-navigation: true
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Главная
      - href: projects.qmd
        text: Проекты
      - href: cv.qmd
        text: Резюме
    right:
      - icon: github
        href: "https://github.com/wickedstacy085"
        aria-label: GitHub
      - icon: envelope
        href: "mailto:anastasiasmirnova085@gmail.com"
        aria-label: Email
  page-footer:
    left: "Анастасия Смирнова, 2026 · текст CC BY 4.0, код MIT"
    right: "[Исходный код сайта](https://github.com/wickedstacy085/wickedstacy085.github.io)"

format:
  html:
    theme:
      light: [cosmo, assets/custom.scss]
      dark: [darkly, assets/custom.scss]
    toc: true
    code-fold: true
    code-tools: false
    code-copy: true
    fig-width: 8
    fig-height: 4.5
    lang: ru
