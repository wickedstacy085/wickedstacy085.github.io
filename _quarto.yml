project:
  type: website
  output-dir: _site

execute:
  freeze: auto        # код считается локально, CI только собирает HTML из _freeze/

website:
  title: "Анастасия Смирнова"
  description: "Эконометрика временных рядов и макропрогнозирование"
  site-url: "https://wickedstacy085.github.io"
  repo-url: "https://github.com/wickedstacy085/wickedstacy085.github.io"
  repo-actions: [source]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Главная
      - href: projects.qmd
        text: Проекты
      - href: cv.qmd
        text: Резюме
    right:
      - icon: github
        href: "https://github.com/wickedstacy085"
        aria-label: GitHub
      - icon: envelope
        href: "mailto:anastasiasmirnova085@gmail.com"
        aria-label: Email
  page-footer:
    left: "© 2026 Анастасия Смирнова"
    right: "Собрано на [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, assets/custom.scss]
      dark: [darkly, assets/custom.scss]
    toc: true
    code-fold: true
    code-tools: true
    code-copy: true
    fig-width: 8
    fig-height: 4.5
    lang: ru
